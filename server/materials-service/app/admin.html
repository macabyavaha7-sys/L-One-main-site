<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L-One 素材管理</title>
  <style>
    :root { --paper:#f7f7f8; --surface:#fff; --ink:#171717; --muted:#707070; --line:#d9d9dc; --blue:#002fa7; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button,input { min-height:42px; border:1px solid var(--line); border-radius:0; background:var(--surface); color:var(--ink); padding:10px 12px; }
    button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    button.dark { background:var(--ink); border-color:var(--ink); color:#fff; }
    button.danger { color:var(--red); }
    button:disabled { cursor:wait; opacity:.55; }
    .hidden { display:none !important; }
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-card { width:min(460px,100%); background:var(--surface); border:1px solid var(--line); padding:32px; }
    .kicker { margin:0 0 12px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,5vw,58px); font-weight:500; letter-spacing:-.05em; }
    h2 { margin:0; font-size:18px; font-weight:500; }
    .login-form,.upload-form { display:grid; gap:12px; margin-top:28px; }
    label { display:grid; gap:7px; color:var(--muted); font-size:13px; }
    .error { color:var(--red); font-size:13px; min-height:18px; }
    .shell { width:min(1500px,calc(100% - 48px)); margin:auto; padding:28px 0 72px; }
    .masthead,.section-head,.row,.toolbar,.asset { display:flex; align-items:center; }
    .masthead { justify-content:space-between; gap:20px; padding-bottom:22px; border-bottom:1px solid var(--ink); }
    .masthead h1 { font-size:clamp(30px,4vw,48px); }
    .toolbar { gap:8px; flex-wrap:wrap; }
    .toolbar button,.toolbar a { min-height:34px; padding:7px 10px; font-size:13px; }
    .disk { margin:22px 0; background:var(--surface); border:1px solid var(--line); padding:16px; }
    .row { justify-content:space-between; gap:16px; }
    .meta { color:var(--muted); font-size:13px; }
    .meter { height:8px; margin-top:12px; background:#e5e5e8; overflow:hidden; }
    .meter span { display:block; height:100%; background:var(--blue); }
    .meter.warning span { background:var(--red); }
    .dashboard { display:grid; grid-template-columns:380px minmax(0,1fr); gap:24px; }
    .panel { background:var(--surface); border:1px solid var(--line); padding:20px; min-width:0; }
    .panel-wide { grid-column:1/-1; }
    .section-head { justify-content:space-between; gap:12px; margin-bottom:18px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .stat { padding:18px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .stat strong { display:block; margin-top:8px; font-size:28px; font-weight:500; }
    .list { border-top:1px solid var(--line); }
    .empty { padding:28px 0; color:var(--muted); }
    .job,.asset { gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
    .job { display:flex; justify-content:space-between; align-items:flex-start; }
    .item-main { min-width:0; flex:1; }
    .title { margin:0 0 6px; font-size:15px; overflow-wrap:anywhere; }
    .status { display:inline-block; margin-right:8px; padding:3px 6px; border:1px solid var(--line); font-size:12px; }
    .status.queued,.status.processing { color:var(--blue); border-color:var(--blue); }
    .status.failed { color:var(--red); border-color:var(--red); }
    .asset-preview { width:128px; aspect-ratio:16/9; object-fit:cover; background:#ededee; flex:0 0 auto; }
    .audit { width:100%; border-collapse:collapse; font-size:13px; }
    .audit th,.audit td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    .audit th { color:var(--muted); font-weight:400; }
    @media (max-width:900px) { .shell{width:min(100% - 28px,760px)} .dashboard{grid-template-columns:1fr} .panel-wide{grid-column:auto} .masthead{align-items:flex-start;flex-direction:column} .asset{align-items:flex-start;flex-direction:column}.asset-preview{width:100%}.stats{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <section class="login" id="login-view">
    <div class="login-card">
      <p class="kicker">L-One Content Administration</p>
      <h1>素材管理</h1>
      <form class="login-form" id="login-form">
        <label>账号<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">登录</button>
        <p class="error" id="login-error" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <main class="shell hidden" id="admin-view">
    <header class="masthead">
      <div><p class="kicker">L-One Content Administration</p><h1>素材管理</h1></div>
      <div class="toolbar"><span class="meta" id="current-user"></span><button id="refresh" type="button">刷新</button><button id="logout" type="button">退出</button></div>
    </header>

    <section class="disk">
      <div class="row"><strong>服务器磁盘</strong><span class="meta" id="disk-text">读取中</span></div>
      <div class="meter" id="disk-meter"><span style="width:0"></span></div>
    </section>

    <div class="dashboard">
      <section class="panel">
        <div class="section-head"><h2>上传素材</h2><span class="meta">视频会自动转码</span></div>
        <form class="upload-form" id="upload-form">
          <label>标题<input name="title" required></label>
          <label>分类<input name="category" value="未分类" required></label>
          <label>关键词<input name="tags" placeholder="多个关键词使用英文逗号分隔"></label>
          <label>替换已有素材 ID<input name="replace_asset_id" placeholder="新素材请留空"></label>
          <label>视频文件<input name="file" type="file" accept="video/*" required></label>
          <button class="primary" type="submit">上传并加入队列</button>
          <p class="meta" id="upload-feedback" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel">
        <div class="section-head"><h2>当前状态</h2><span class="meta">自动更新公开素材清单</span></div>
        <div class="stats">
          <div class="stat"><span class="meta">等待转码</span><strong id="queued-count">0</strong></div>
          <div class="stat"><span class="meta">处理中</span><strong id="processing-count">0</strong></div>
          <div class="stat"><span class="meta">已发布</span><strong id="asset-count">0</strong></div>
        </div>
      </section>

      <section class="panel panel-wide" id="jobs-panel">
        <div class="section-head"><h2>转码任务</h2><span class="meta">失败任务可重试</span></div>
        <div class="list" id="jobs-list"></div>
      </section>

      <section class="panel panel-wide" id="assets-panel">
        <div class="section-head"><h2>已发布素材</h2><span class="meta">删除内容保留 7 天</span></div>
        <div class="list" id="assets-list"></div>
      </section>

      <section class="panel panel-wide">
        <div class="section-head"><h2>操作记录</h2><span class="meta">最近 50 条</span></div>
        <div style="overflow:auto"><table class="audit"><thead><tr><th>时间</th><th>账号</th><th>操作</th><th>对象</th><th>结果</th></tr></thead><tbody id="audit-list"></tbody></table></div>
      </section>
    </div>
  </main>

  <script>
    const state = { csrf:'', jobs:[], assets:[], status:null };
    const $ = (value) => document.querySelector(value);
    const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const gigabytes = (value) => `${(Number(value || 0) / 1024 ** 3).toFixed(1)} GB`;

    async function request(url, options={}) {
      const headers = { ...(options.headers || {}) };
      if (state.csrf && !['GET','HEAD'].includes(options.method || 'GET')) headers['X-CSRF-Token'] = state.csrf;
      const response = await fetch(url, { ...options, headers, credentials:'same-origin' });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) { if (response.status === 401) showLogin(); throw new Error(body.detail || `请求失败：${response.status}`); }
      return body;
    }

    function showLogin() { $('#admin-view').classList.add('hidden'); $('#login-view').classList.remove('hidden'); }
    function showAdmin(username) { $('#current-user').textContent = username; $('#login-view').classList.add('hidden'); $('#admin-view').classList.remove('hidden'); }

    function renderJobs() {
      $('#jobs-list').innerHTML = state.jobs.length ? state.jobs.map(job => `<article class="job"><div class="item-main"><p class="title">${escapeHtml(job.title)}</p><span class="status ${escapeHtml(job.status)}">${escapeHtml(job.status)}</span><span class="meta">${escapeHtml(job.original_name)} · ${new Date(job.created_at).toLocaleString('zh-CN')}${job.replace_asset_id ? ` · 替换 ${escapeHtml(job.replace_asset_id)}` : ''}</span>${job.error ? `<p class="error">${escapeHtml(job.error)}</p>` : ''}</div><div class="toolbar">${job.status === 'failed' ? `<button data-retry="${job.id}">重试</button>` : ''}</div></article>`).join('') : '<p class="empty">当前没有转码任务。</p>';
    }

    function renderAssets() {
      $('#assets-list').innerHTML = state.assets.length ? state.assets.map(asset => `<article class="asset"><img class="asset-preview" src="https://static.l-one.asia/materials/${escapeHtml(asset.thumbnail)}" alt="" loading="lazy"><div class="item-main"><p class="title">${escapeHtml(asset.title)}</p><span class="meta">${escapeHtml(asset.category)} · ${Number(asset.duration || 0).toFixed(1)} 秒 · ${asset.width} × ${asset.height}<br>ID：${escapeHtml(asset.id)}</span></div><div class="toolbar"><a href="https://static.l-one.asia/materials/${escapeHtml(asset.video)}" target="_blank" rel="noopener">预览</a><button data-replace="${asset.id}">替换</button><button class="danger" data-delete="${asset.id}">删除</button></div></article>`).join('') : '<p class="empty">当前没有已发布素材。</p>';
    }

    function renderStatus() {
      const disk = state.status.disk; const percent = disk.totalBytes ? disk.usedBytes / disk.totalBytes * 100 : 0;
      $('#disk-text').textContent = `已用 ${gigabytes(disk.usedBytes)} / ${gigabytes(disk.totalBytes)}，剩余 ${gigabytes(disk.freeBytes)}`;
      $('#disk-meter span').style.width = `${Math.min(percent,100)}%`;
      $('#disk-meter').classList.toggle('warning', percent >= 80);
      $('#queued-count').textContent = state.jobs.filter(job => job.status === 'queued').length;
      $('#processing-count').textContent = state.jobs.filter(job => job.status === 'processing').length;
      $('#asset-count').textContent = state.assets.length;
      $('#audit-list').innerHTML = (state.status.audit || []).map(row => `<tr><td>${new Date(row.created_at).toLocaleString('zh-CN')}</td><td>${escapeHtml(row.username)}</td><td>${escapeHtml(row.action)}</td><td>${escapeHtml(row.target)}</td><td>${escapeHtml(row.result)}</td></tr>`).join('');
    }

    async function refresh() {
      [state.jobs,state.assets,state.status] = await Promise.all([request('/api/admin/jobs'),request('/api/admin/assets'),request('/api/admin/status')]);
      renderJobs(); renderAssets(); renderStatus();
    }

    $('#login-form').addEventListener('submit', async event => {
      event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button'); button.disabled = true;
      try { const result = await request('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})}); state.csrf=result.csrfToken; showAdmin(result.username); form.reset(); await refresh(); $('#login-error').textContent=''; }
      catch(error) { $('#login-error').textContent=error.message; }
      finally { button.disabled=false; }
    });

    $('#logout').addEventListener('click', async () => { await request('/api/admin/logout',{method:'POST'}); state.csrf=''; showLogin(); });
    $('#refresh').addEventListener('click', () => refresh().catch(error => alert(error.message)));
    $('#upload-form').addEventListener('submit', async event => {
      event.preventDefault(); const form=event.currentTarget; const button=form.querySelector('button'); button.disabled=true; $('#upload-feedback').textContent='上传中，请保持页面打开。';
      try { const result=await request('/api/admin/assets',{method:'POST',body:new FormData(form)}); $('#upload-feedback').textContent=`任务 ${result.id} 已加入队列。`; form.reset(); form.category.value='未分类'; await refresh(); }
      catch(error) { $('#upload-feedback').textContent=error.message; }
      finally { button.disabled=false; }
    });

    $('#jobs-list').addEventListener('click', async event => { const id=event.target.dataset.retry; if(!id)return; await request(`/api/admin/jobs/${id}/retry`,{method:'POST'}); await refresh(); });
    $('#assets-list').addEventListener('click', async event => {
      const replaceId=event.target.dataset.replace; if(replaceId){ $('#upload-form').replace_asset_id.value=replaceId; $('#upload-form').scrollIntoView({behavior:'smooth'}); return; }
      const deleteId=event.target.dataset.delete; if(!deleteId || !confirm('确认删除这条素材？内容将在回收站保留 7 天。'))return;
      await request(`/api/admin/assets/${deleteId}`,{method:'DELETE'}); await refresh();
    });

    request('/api/admin/session').then(result => { state.csrf=result.csrfToken; showAdmin(result.username); return refresh(); }).catch(showLogin);
  </script>
</body>
</html>
